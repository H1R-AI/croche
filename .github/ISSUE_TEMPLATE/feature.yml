name: Feature request
description: Something your app needs that Croche does not do.
labels: ["type:feature"]
body:
  - type: textarea
    id: need
    attributes: { label: What your app needs, description: "The user-facing goal, not the implementation." }
    validations: { required: true }
  - type: textarea
    id: today
    attributes: { label: How you work around it today }
