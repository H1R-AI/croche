name: Developer experience
description: It works, but the SDK or the docs made it hard.
labels: ["type:dx"]
body:
  - type: textarea
    id: goal
    attributes: { label: What you were trying to do }
    validations: { required: true }
  - type: textarea
    id: friction
    attributes: { label: What made it hard, description: "Missing or wrong docs, a confusing API, an error that did not say what to do..." }
    validations: { required: true }
  - type: textarea
    id: suggestion
    attributes: { label: What would have helped }
  - type: input
    id: sdk
    attributes: { label: SDK version and platform }
